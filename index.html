<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英二词句">
<title>英二 · 词句</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <button id="backBtn" class="top-btn back hidden" aria-label="返回">‹</button>
    <h1 id="pageTitle">卷子</h1>
    <div id="topRight" class="top-right"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav id="tabbar">
    <button class="tab" data-route="papers">
      <span class="tab-ico">▤</span><span class="tab-lbl">卷子</span>
    </button>
    <button class="tab" data-route="sentences">
      <span class="tab-ico">⌇</span><span class="tab-lbl">句式</span>
    </button>
    <button class="tab" data-route="wordlist">
      <span class="tab-ico">☰</span><span class="tab-lbl">词表</span>
    </button>
    <button class="tab" data-route="reader">
      <span class="tab-ico">✎</span><span class="tab-lbl">阅读</span>
    </button>
    <button class="tab" data-route="stats">
      <span class="tab-ico">▨</span><span class="tab-lbl">统计</span>
    </button>
  </nav>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel">
    <button class="sheet-close" data-close aria-label="关闭">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
